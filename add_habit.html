  <head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>HabitFlow</h1>
    </header>
    <nav>
      <b>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="habits.html">My Habits</a>
        <a href="progress.html">Progress</a>
        <a href="tips.html">Tips & Resources</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </b>

    <main>
      <h2>Add Habit</h2>
      <section>
        <h3>Habit Details</h3>
        <!-- right now this is just a form that doesn't go anywhere since we have no local storage yet -->
        <p>
          Create a new habit to track. Once added, it will appear on the
          <a href="habits.html">My Habits</a> page.
        </p>

        <form>
          <div>
            <label for="habitName">Habit name</label>
            <input
              type="text"
              id="habitName"
              name="habitName"
              placeholder="e.g., Drink 2L of water"
              required>
          </div>

          <div>
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Select a category</option>
              <option value="Health">Health</option>
              <option value="Productivity">Productivity</option>
              <option value="Learning">Learning</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div>
            <label for="description">Description</label>
            <textarea
              id="description"
              name="description"
              rows="6"
              cols="50"
              placeholder="Why this habit matters, what success looks like, etc."
            ></textarea>
          </div>

          <div>
            <label for="frequency">Frequency</label>
            <select id="frequency" name="frequency">
              <option value="Daily">Daily</option>
              <option value="TwiceWeekly">Twice Weekly</option>
              <option value="ThriceWeekly">Thrice Weekly</option>
              <option value="Weekly">Weekly</option>
            </select>
          </div>

          <div>
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div>
            <button type="submit">Add Habit</button>
            <button type="reset">Clear</button>
          </div>
        </form>
      </section>
    </main>
    <footer>
      <hr>
      Copyright &copy; 2026 Project HabitFlow. All rights reserved.
    </footer>
  </body>
</html>
